services:
  node1:
    image: ghcr.io/litesql/pocketbase-hc:latest
    volumes:
      - node1_data:/app/pb_data
    restart: on-failure
    ports:
      - "8090:8090"
      - "9090:9090"
    environment:
      - PB_NAME=node1
      - PB_PEERS=http://node2:9090=secret-key,http://node3:9090=secret3
      - PB_GRPC_PORT=9090
      - PB_GRPC_TOKEN=secret
      - PB_SUPERUSER_EMAIL=test@example.com
      - PB_SUPERUSER_PASS=1234567890

  node2:
    image: ghcr.io/litesql/pocketbase-hc:latest
    volumes:
      - node2_data:/app/pb_data
    restart: on-failure
    ports:      
      - "8091:8090"
      - "9091:9090"
    environment:
      - PB_NAME=node2      
      - PB_PEERS=http://node1:9090=secret,http://node3:9090=secret3
      - PB_GRPC_PORT=9090
      - PB_GRPC_TOKEN=secret-key

  node3:
    image: ghcr.io/litesql/pocketbase-hc:latest
    volumes:
      - node3_data:/app/pb_data
    restart: on-failure
    ports:
      - "8092:8090"
      - "9092:9090"
    environment:
      - PB_NAME=node3
      - PB_PEERS=http://node1:9090=secret,http://node2:9090=secret-key
      - PB_GRPC_PORT=9090
      - PB_GRPC_TOKEN=secret3

volumes:
  node1_data:
    driver: local
  node2_data:
    driver: local
  node3_data:
    driver: local